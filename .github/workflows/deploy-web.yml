# Builds the web version of the app and publishes it on GitHub Pages:
#   https://parthibanthiru.github.io/sendwiselab/                 the app (Expo web, single-page)
#   https://parthibanthiru.github.io/sendwiselab/prototype-web/   the currency-exchange concept demo
#
# One-time setup on GitHub:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Supabase keys: the SendWiseLab project's URL and public anon key are set below. To use
#      another project, add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY under
#      Settings → Secrets and variables → Actions → Variables (never the service-role key).
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build the web app
        env:
          # SendWiseLab Supabase project (Frankfurt). The anon key is public by design: it ships in the
          # site's JavaScript, and Row Level Security protects the data. Repo variables override these.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://zyprumoiyepyksmonohc.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5cHJ1bW9peWVweWtzbW9ub2hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njc5MjgsImV4cCI6MjEwODQ0MzkyOH0.xesg1qloCUxWNQeIAUm8wPZiKjkhHeSMQE4xvjrUnnA' }}
        run: npx expo export --platform web --output-dir dist

      - name: Add page fallback and the prototype
        run: |
          # GitHub Pages has no server-side routing: unknown paths get 404.html, which is the app,
          # so links such as /sendwiselab/ueberweisen/neu open the right screen.
          cp dist/index.html dist/404.html
          cp -r prototype-web dist/prototype-web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
